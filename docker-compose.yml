version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: seamless
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py seed_demo && python manage.py generate_qr && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=seamless
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=seamless-prod-secret-key-change-in-production
      - DEBUG=0
      - PUBLIC_BASE_URL=http://192.168.104.78
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - web
volumes:
  postgres_data:
